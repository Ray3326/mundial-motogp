<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mundial MotoGP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: paddock timing screen. Kerb-stripe header, one centred column, tables that read like a timing tower. Team colours live only on number plates and chart lines; the kerb red is the single loud accent. */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f3f4f8; --ink:#14171f; --muted:#5a6172; --line:#d9dde6;
  --accent:#d3241c; --accent-ink:#ffffff; --kerb-b:#ffffff; --good:#1d7a46; --bad:#b3261e; --shadow:rgba(20,23,31,.18);
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --surface:#161a22; --surface-2:#1c212b; --ink:#eceef3; --muted:#98a0b2; --line:#2a3040;
    --accent:#ff5245; --accent-ink:#14171f; --kerb-b:#e9ebf0; --good:#4cc27f; --bad:#ff7b70; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#161a22; --surface-2:#1c212b; --ink:#eceef3; --muted:#98a0b2; --line:#2a3040;
  --accent:#ff5245; --accent-ink:#14171f; --kerb-b:#e9ebf0; --good:#4cc27f; --bad:#ff7b70; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(circle at 10% 0%,rgba(211,36,28,.06),transparent 28%),var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.015em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 0%,rgba(211,36,28,.14),transparent 32%),var(--bg)}
.auth-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 24px 70px var(--shadow)}
.auth-brand{font-family:var(--font-display);font-size:42px;font-weight:900;line-height:.9;text-transform:uppercase;margin-bottom:8px}
.auth-sub{color:var(--muted);margin-bottom:26px}.auth-form{display:grid;gap:14px}.auth-form label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.auth-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);font:inherit}.auth-error{min-height:20px;color:var(--bad);font-size:13px}.auth-btn{width:100%;padding:13px 16px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:800;cursor:pointer}.top-actions{display:flex;align-items:center;justify-content:center;flex:0 0 auto}.logout{margin-left:0}.auth-lock{font-family:var(--font-data);font-size:11px;color:var(--muted);margin-top:16px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
main.wrap{padding-block:24px 72px;display:flex;flex-direction:column;gap:24px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}


/* ---------- premium cover ---------- */
.cover{position:relative;min-height:330px;border-radius:18px;overflow:hidden;background:#111;color:#fff;
  box-shadow:0 18px 50px rgba(15,18,28,.20);isolation:isolate}
.cover-bg{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(7,10,16,.88) 0%,rgba(7,10,16,.52) 45%,rgba(7,10,16,.12) 100%);background-size:cover;background-position:center}
.cover:after{content:"";position:absolute;inset:auto 0 0;height:7px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,#fff 28px 56px);z-index:2}
.cover-content{position:relative;z-index:1;min-height:330px;padding:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.cover-kicker{font:600 12px var(--font-data);letter-spacing:.12em;text-transform:uppercase;opacity:.82}
.cover h2{font-size:clamp(42px,8vw,76px);font-weight:900;max-width:760px}
.cover p{max-width:650px;color:rgba(255,255,255,.78);font-size:15px}
.cover-next{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cover-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);backdrop-filter:blur(8px);border-radius:999px;padding:7px 11px;font-size:12px}
.cover-pill b{color:#fff}
.race-lock{opacity:.58;cursor:not-allowed!important;position:relative}
.race-thumb{width:110px;height:62px;object-fit:cover;border-radius:8px;display:block;background:#ddd}
.race-cell{display:flex;align-items:center;gap:10px;min-width:260px}
.race-cell .race-info{min-width:0}
.race-photo{width:100%;height:220px;object-fit:cover;border-radius:12px;display:block;background:#ddd}
.photo-credit{font-size:10px;color:var(--muted);margin-top:5px}

.race-lock:hover td{background:transparent!important}
.race-lock .lock-note{font-size:11px;color:var(--muted);font-weight:600}
@media(max-width:760px){
  .topin{gap:8px 12px}
  .brand{max-width:55%}
  .header-right{max-width:45%}
  .top-role{position:static;transform:none;order:0;width:auto;justify-content:flex-start;text-align:left}
}
@media(max-width:640px){.cover,.cover-content{min-height:285px}.cover-content{padding:24px}.cover h2{font-size:42px}}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.kerb{height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,var(--kerb-b) 28px 56px)}
.topin{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:8px 14px;padding:16px 16px;max-width:none;width:100%;box-sizing:border-box}
.brand{display:flex;align-items:baseline;min-width:0;flex:0 0 auto}
.brand h1{font-size:clamp(30px,6vw,48px);font-weight:900}
.season{font:500 13px var(--font-data);color:var(--muted);margin-left:8px}
.ro{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:2px 9px}
.top-role{position:static;transform:none;margin:0;white-space:nowrap;text-align:left;flex:0 0 auto}
.header-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{appearance:none;border:0;background:none;transition:.18s ease;font:600 14px var(--font-body);color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(20,23,31,.06);min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-size:22px;font-weight:800}
.pb{padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right}
td.num{font-family:var(--font-data);font-weight:500}
td.pts{font-weight:600}
.pos{font:800 20px var(--font-display);width:52px;white-space:nowrap}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:600}
.who>span{min-width:0}
.plate{display:inline-grid;place-items:center;min-width:34px;height:26px;padding-inline:6px;border-radius:6px;font:800 18px/1 var(--font-display);flex:none}
.plate.lg{min-width:88px;height:68px;font-size:46px;border-radius:12px}
.chip{display:inline-block;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dnf{color:var(--bad)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}

/* buttons & fields */
.btn{font:600 13.5px var(--font-body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:38px;width:64px;cursor:pointer}
textarea{resize:vertical;min-height:88px}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f .hint{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 13px var(--font-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* summary strip */
.pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 28px}
.pulse>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font:800 34px/1 var(--font-display)}
.big small{font:500 14px var(--font-data);color:var(--muted);margin-left:4px}
.bar{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hide-sm{display:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink)}
.rcard:hover{background:var(--surface-2)}
.rcard .plate{min-width:46px;height:40px;font-size:26px}
.rcard b{display:block;font-weight:600}
.rcard .pp{margin-left:auto;text-align:right;font:600 15px var(--font-data)}
.rcard .pp small{display:block;font:500 11px var(--font-body);color:var(--muted)}

/* profile */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px}
.phead h2{font-size:clamp(30px,6vw,46px);font-weight:900}
.phead .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats>div{background:var(--surface);padding:12px 14px}
.stats .v{display:block;font:800 32px/1.1 var(--font-display);margin-top:2px}
.back{border:0;background:none;color:var(--muted);font:600 13px var(--font-body);cursor:pointer;padding:0;align-self:flex-start}
.back:hover{color:var(--ink)}
.bio{max-width:65ch;white-space:pre-wrap}

/* chart */
.chartbox{position:relative;padding:8px 12px 4px}
.chartbox svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:11px var(--font-data)}
.xh{stroke:var(--muted);stroke-dasharray:3 3;visibility:hidden}
.chart-hit{touch-action:pan-y;fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px var(--shadow);min-width:170px;z-index:2}
.tip-h{font-weight:600;margin-bottom:4px}
.tip-r{display:flex;align-items:center;gap:8px;padding-block:1px}
.tip-r i{width:10px;height:10px;border-radius:2px;flex:none}
.tip-r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip-r b{font-family:var(--font-data);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 16px 14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:22px;height:0}

/* messages */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;background:var(--surface)}
.empty{padding:28px 22px;display:grid;gap:16px;max-width:680px}
.empty h2{font-size:34px;font-weight:900}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.note{padding:22px 16px;color:var(--muted)}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,12,18,.58);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:50}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(620px,100%);box-shadow:0 20px 60px var(--shadow)}
.sheet.wide{width:min(880px,100%)}
.sh{padding:16px 18px;border-bottom:1px solid var(--line)}
.sh h2{font-size:26px;font-weight:800}
.sb{padding:16px 18px;display:grid;gap:14px}
.sf{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 12px 12px}
.sf .msg{margin-right:auto;font-size:12.5px;color:var(--bad);min-width:0}
.sheet select.pos-sel{width:96px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

/* ---------- comunidad / perfiles / campeones ---------- */
.social-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:20px;align-items:start}
@media(max-width:900px){.social-grid{grid-template-columns:1fr}}
.postbox{display:grid;gap:10px}
.post-card{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.post-card:last-child{border-bottom:0}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font:800 18px var(--font-display);flex:none;border:1px solid var(--line)}
.avatar.lg{width:84px;height:84px;font-size:34px}
.post-author{min-width:0;display:grid;gap:1px}
.post-author b{font-weight:700}
.post-time{font-size:11px;color:var(--muted)}
.post-text{white-space:pre-wrap;word-break:break-word}
.clip{width:100%;max-height:520px;border-radius:12px;background:#000;display:block}
.post-actions{display:flex;align-items:center;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;cursor:pointer;color:var(--muted)}
.iconbtn.active{color:var(--accent);border-color:var(--accent)}
.comment-list{display:grid;gap:8px;margin-top:4px}
.comment{display:flex;gap:8px;font-size:13px}
.comment b{margin-right:5px}
.profile-cover{padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-main{display:grid;gap:5px;min-width:0;flex:1}
.profile-name{font:900 clamp(30px,6vw,48px)/.95 var(--font-display);text-transform:uppercase}
.season-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.season-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.season-card:hover{background:var(--surface-2)}
.season-year{font:900 44px/1 var(--font-display)}
.champion{display:flex;align-items:center;gap:12px;margin-top:12px}
.champion .avatar{width:54px;height:54px}
.community-side{display:grid;gap:14px}
.follow-list{display:grid;gap:8px}
.follow-row{display:flex;align-items:center;gap:9px}
.follow-row .avatar{width:34px;height:34px;font-size:15px}
@media(max-width:640px){.post-card{padding:14px}.profile-cover{padding:16px}}
</style>

<div id="app"></div>
<div id="overlay" hidden></div>
<div id="toast" role="status" hidden></div>

function supabaseDB(){
  var client=window.supabase.createClient(
    'https://hooawrsgrbmqwhkgdjqo.supabase.co',
    'sb_publishable_-R2Oy3D8nzphZYNEZo13-w_047Uaovb'
  );
  var listeners={};
  function tableName(col){return col;}
  function toDb(col,data){
    var x=Object.assign({},data);
    if(col==='riders'){if('teamId' in x){x.team_id=x.teamId;delete x.teamId;}}
    if(col==='races'){if('round' in x){x.round=x.round;} }
    if(col==='settings'){if('flPoint' in x){x.fl_point=x.flPoint;delete x.flPoint;}}
    return x;
  }
  function fromDb(col,row){
    var x=Object.assign({},row);
    if(col==='riders'&&'team_id' in x){x.teamId=x.team_id;delete x.team_id;}
    if(col==='settings'&&'fl_point' in x){x.flPoint=x.fl_point;delete x.fl_point;}
    return x;
  }
  async function getAll(col){
    var q=await client.from(tableName(col)).select('*');
    if(q.error)throw q.error;
    return (q.data||[]).map(function(r){return Object.assign({id:r.id},fromDb(col,r));});
  }
  async function getDoc(col,id){
    var q=await client.from(tableName(col)).select('*').eq('id',id).maybeSingle();
    if(q.error)throw q.error;
    return {exists:!!q.data,id:id,data:function(){return q.data?fromDb(col,q.data):undefined;}};
  }
  function notify(col){
    (listeners[col]||[]).forEach(function(fn){getAll(col).then(function(rows){fn({docs:rows.map(function(r){return {id:r.id,data:function(){var x=Object.assign({},r);delete x.id;return x;}};})});}).catch(console.error);});
  }
  function watch(col,fn,fail){
    (listeners[col]||(listeners[col]=[])).push(fn);
    getAll(col).then(function(rows){fn({docs:rows.map(function(r){return {id:r.id,data:function(){var x=Object.assign({},r);delete x.id;return x;}};})});}).catch(fail||console.error);
  }
  ['teams','riders','races','settings'].forEach(function(col){
    client.channel('motogp-'+col).on('postgres_changes',{event:'*',schema:'public',table:col},function(){notify(col);}).subscribe();
  });
  function makeDoc(col,id){
    var did=id||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9));
    return {id:did,
      onSnapshot:function(fn,fail){getDoc(col,did).then(fn).catch(fail||console.error);},
      get:function(){return getDoc(col,did);},
      set:function(data){return client.from(tableName(col)).upsert(toDb(col,Object.assign({},data,{id:did}))).select().single().then(function(q){if(q.error)throw q.error;notify(col);return q.data;});},
      delete:function(){return client.from(tableName(col)).delete().eq('id',did).then(function(q){if(q.error)throw q.error;notify(col);});}
    };
  }
  return {
    collection:function(col){return {
      onSnapshot:function(fn,fail){watch(col,fn,fail);},
      doc:function(id){return makeDoc(col,id);},
      getAll:function(){return getAll(col);}
    };
    },
    doc:function(path){var p=String(path).split('/'),col=p[0],id=p[1];return makeDoc(col,id);},
    client:client
  };
}

function niceStep(max){var raw=max/5,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;return (n<=1?1:n<=2?2:n<=5?5:10)*mag;}

/* ---------- championship maths ---------- */
function cmpPc(a,b){for(var i=0;i<30;i++){if(a[i]!==b[i])return b[i]-a[i];}return 0;}
function compute(){
  var cfg=S.cfg;
  var races=S.races.slice().sort(function(a,b){return (a.round||0)-(b.round||0)||String(a.name).localeCompare(String(b.name));});
  var done=races.filter(hasResults), st={};
  S.riders.forEach(function(r){st[r.id]={r:r,pts:0,wins:0,podiums:0,poles:0,fl:0,dnf:0,entries:0,best:null,sumPos:0,nPos:0,pc:zeros(30),rows:{},cum:[0]};});
  done.forEach(function(race){
    S.riders.forEach(function(r){
      var s=st[r.id], gp=(race.gp||{})[r.id], p=0;
      if(gp!==undefined){
        s.entries++;
        if(typeof gp==='number'){
          p+=cfg.gp[gp-1]||0; s.pc[Math.min(gp,30)-1]++;
          if(gp===1)s.wins++; if(gp<=3)s.podiums++;
          s.best=s.best===null?gp:Math.min(s.best,gp); s.sumPos+=gp; s.nPos++;
        } else if(gp==='DNF'){s.dnf++;}
      }
      var isPole=race.pole===r.id, isFl=race.fl===r.id;
      if(isPole)s.poles++;
      if(isFl){s.fl++;p+=Number(cfg.flPoint)||0;}
      s.rows[race.id]={gp:gp,pts:p,pole:isPole,fl:isFl};
      s.pts+=p; s.cum.push(s.pts);
    });
  });
  var ranked=Object.keys(st).map(function(k){return st[k];}).sort(function(a,b){return b.pts-a.pts||cmpPc(a.pc,b.pc)||String(a.r.name).localeCompare(String(b.r.name));});
  var rank={}; ranked.forEach(function(s,i){rank[s.r.id]=i+1;});
  var tt={};
  S.teams.forEach(function(t){tt[t.id]={t:t,pts:0,pc:zeros(30),cum:zeros(done.length+1),riders:[]};});
  Object.keys(st).forEach(function(k){
    var s=st[k],x=tt[s.r.teamId]; if(!x)return;
    x.pts+=s.pts; x.riders.push(s);
    s.pc.forEach(function(n,i){x.pc[i]+=n;}); s.cum.forEach(function(v,i){x.cum[i]+=v;});
  });
  var tRanked=Object.keys(tt).map(function(k){return tt[k];}).sort(function(a,b){return b.pts-a.pts||cmpPc(a.pc,b.pc)||String(a.t.name).localeCompare(String(b.t.name));});
  return {races:races,done:done,st:st,ranked:ranked,rank:rank,tt:tt,tRanked:tRanked};
}

function lineChart(id,series,shortL,longL){
  var W=720,H=300,ml=44,mr=18,mt=14,mb=30,n=shortL.length;
  var all=[10]; series.forEach(function(s){all=all.concat(s.vals);});
  var maxV=Math.max.apply(null,all);
  var step=niceStep(maxV), yMax=Math.ceil(maxV/step)*step;
  function X(i){return ml+i*(W-ml-mr)/(n-1);} function Y(v){return mt+(H-mt-mb)*(1-v/yMax);}
  CH[id]={series:series,long:longL,W:W,ml:ml,mr:mr,n:n};
  var g='',v; for(v=0;v<=yMax;v+=step){g+='<line class="grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(ml-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';}
  var every=Math.ceil(n/12), xl='';
  shortL.forEach(function(s,i){if(s&&i%every===0)xl+='<text class="ax" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(s)+'</text>';});
  var lines=series.slice().reverse().map(function(s){
    var pts=s.vals.map(function(val,i){return X(i).toFixed(1)+','+Y(val).toFixed(1);}).join(' ');
    var last=s.vals.length-1;
    return '<polyline points="'+pts+'" fill="none" style="stroke:'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>'+
      '<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(s.vals[last]).toFixed(1)+'" r="4.5" style="fill:'+s.color+';stroke:var(--surface)" stroke-width="2"/>';
  }).join('');
  var legend=series.map(function(s){return '<span><i style="border-top:3px '+(s.dash?'dashed':'solid')+' '+s.color+'"></i>'+esc(s.name)+'</span>';}).join('');
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de puntos carrera a carrera">'+g+xl+lines+
    '<line class="xh" x1="0" x2="0" y1="'+mt+'" y2="'+(H-mb)+'"/><rect class="chart-hit" data-chart="'+id+'" x="0" y="0" width="'+W+'" height="'+H+'"/></svg><div class="tip" hidden></div></div>'+
    '<div class="legend">'+legend+'</div>';
}
function bindCharts(){
  $app.querySelectorAll('.chart-hit').forEach(function(el){
    var box=el.closest('.chartbox'), svg=el.ownerSVGElement, tip=box.querySelector('.tip'), xh=svg.querySelector('.xh'), c=CH[el.dataset.chart];
    if(!c)return;
    el.addEventListener('pointermove',function(e){
      var r=svg.getBoundingClientRect(), rx=(e.clientX-r.left)/r.width*c.W;
      var i=Math.round((rx-c.ml)/((c.W-c.ml-c.mr)/(c.n-1))); i=Math.max(0,Math.min(c.n-1,i));
      var x=c.ml+i*(c.W-c.ml-c.mr)/(c.n-1);
      xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.style.visibility='visible';
      tip.replaceChildren();
      var h=document.createElement('div'); h.className='tip-h'; h.textContent=c.long[i]; tip.appendChild(h);
      c.series.map(function(s){return {s:s,v:s.vals[i]};}).sort(function(a,b){return b.v-a.v;}).forEach(function(o){
        var row=document.createElement('div'); row.className='tip-r';
        var sw=document.createElement('i'); sw.style.background=o.s.color;
        var nm=document.createElement('span'); nm.textContent=o.s.name;
        var val=document.createElement('b'); val.textContent=o.v;
        row.append(sw,nm,val); tip.appendChild(row);
      });
      tip.hidden=false;
      var br=box.getBoundingClientRect(), px=(r.left-br.left)+x/c.W*r.width, tw=tip.offsetWidth, left=px+14;
      if(left+tw>br.width-4)left=px-tw-14;
      tip.style.left=Math.max(4,left)+'px'; tip.style.top='12px';
    });
    el.addEventListener('pointerleave',function(){tip.hidden=true;xh.style.visibility='hidden';});
  });
}

      if(col==='seasons')S.seasons=rows.sort(function(a,b){return String(b.year).localeCompare(String(a.year),undefined,{numeric:true});});
      if(currentUser())S.profile=profileById(currentUser().id)||S.profile; refreshPermissions();
      if(['comunidad','perfil','temporadas'].indexOf(S.tab)>=0)render();
    },function(e){console.error(e);});
  });
}
function likesFor(postId){return S.likes.filter(function(x){return x.post_id===postId;});}
function likedByMe(postId){var u=currentUser();return !!u&&likesFor(postId).some(function(x){return x.user_id===u.id;});}

function delBtn(act,id,label){

function emptyState(){

    '<p class="muted">Aquí guardas los resultados de cada carrera de tu campeonato y se calculan solos el mundial de pilotos y el de constructores.</p>'+

    (W?'<div class="btns">'+primary+'</div>':'<p class="muted">Todavía no hay datos.</p>')+'</section>';

function viewMundial(C){
  if(!S.riders.length)return emptyState();
  var nd=C.done.length,total=C.races.length,lead=C.ranked[0],sec=C.ranked[1],last=nd?C.done[nd-1]:null;

    '<div><span class="lbl">Carreras</span><span class="big">'+nd+'<small>de '+total+'</small></span><span class="bar"><i style="width:'+(total?Math.round(nd/total*100):0)+'%"></i></span></div>'+
    '<div><span class="lbl">Líder</span>'+(nd&&lead?'<span class="who">'+plate(lead.r)+'<b>'+esc(lead.r.name)+'</b></span><span class="sub">'+lead.pts+' puntos</span>':'<span class="big">–</span>')+'</div>'+
    '<div><span class="lbl">Ventaja</span><span class="big">'+(nd&&sec?'+'+(lead.pts-sec.pts):'–')+'</span><span class="sub">'+(nd&&sec?'sobre '+esc(sec.r.name):'')+'</span></div>'+
    '<div><span class="lbl">Última carrera</span>'+(last?'<b>'+esc(last.name)+'</b><span class="sub">'+(winner?'Ganó '+esc(winner.name):'Sin ganador registrado')+'</span>':'<span class="big">–</span>')+'</div></section>';
  var rrows=C.ranked.map(function(s,i){
    var t=teamOf(s.r), gap=i===0||!nd?'':'−'+(lead.pts-s.pts);
    return '<tr data-act="rider" data-id="'+esc(s.r.id)+'"><td class="pos">'+(nd?i+1:'–')+'</td><td><span class="who">'+plate(s.r)+'<span><b>'+esc(s.r.name)+'</b><div class="sub">'+esc(t?t.name:'Sin constructor')+'</div></span></span></td>'+
      '<td class="num hide-sm">'+s.wins+'</td><td class="num hide-sm">'+s.podiums+'</td><td class="num hide-sm">'+gap+'</td><td class="num pts">'+s.pts+'</td></tr>';
  }).join('');
  var riderTable='<section class="panel"><div class="ph"><h2>Mundial de pilotos</h2></div><div class="tw"><table><thead><tr><th>Pos</th><th>Piloto</th><th class="num hide-sm">Vic</th><th class="num hide-sm">Pod</th><th class="num hide-sm">Dif</th><th class="num">Pts</th></tr></thead><tbody>'+rrows+'</tbody></table></div></section>';
  var teamTable='';
  if(C.tRanked.length){
    var trows=C.tRanked.map(function(x,i){
      var rs=x.riders.slice().sort(function(a,b){return b.pts-a.pts;}).map(function(s){return esc(surname(s.r.name))+' '+s.pts;}).join(' · ');
      return '<tr><td class="pos">'+(nd?i+1:'–')+'</td><td><span class="who"><i class="sw" style="background:'+hex(x.t.color)+'"></i><span><b>'+esc(x.t.name)+'</b><div class="sub">'+(rs||'Sin pilotos')+'</div></span></span></td><td class="num pts">'+x.pts+'</td></tr>';
    }).join('');
    teamTable='<section class="panel"><div class="ph"><h2>Mundial de constructores</h2></div><div class="tw"><table><thead><tr><th>Pos</th><th>Constructor</th><th class="num">Pts</th></tr></thead><tbody>'+trows+'</tbody></table></div></section>';
  }
  var chart;
  if(!nd){chart='<p class="note">Todavía no hay carreras con resultados. Añade una en la pestaña Carreras y aquí verás cómo evolucionan los puntos.</p>';}

  var chartPanel='<section class="panel"><div class="ph"><h2>Evolución de puntos</h2><div class="seg" role="group" aria-label="Qué mostrar">'+

    (C.tRanked.length?'<button data-act="chart-mode" data-mode="teams" aria-pressed="'+(S.chartMode==='teams')+'">Constructores</button>':'')+'</div></div>'+chart+'</section>';
  return coverHtml(C)+pulse+'<div class="cols">'+riderTable+teamTable+'</div>'+chartPanel;
}

function viewCarreras(C){
  if(S.raceId)return viewRace(C);
  var W=S.canWrite;
  var rows=C.races.map(function(r){
    var done=hasResults(r), w=done?S.riders.find(function(x){return (r.gp||{})[x.id]===1;}):null, allowed=canEnterResults(r);
    var attrs=allowed?' data-act="race" data-id="'+esc(r.id)+'"':'';
    var lock=!done&&!allowed?'<div class="lock-note">Completa la anterior primero</div>':'';
    var photo=r.photo?'<img class="race-thumb" src="'+esc(r.photo)+'" alt="Circuito de '+esc(r.name)+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
    return '<tr class="'+(!allowed?'race-lock':'')+'"'+attrs+'><td class="pos">'+esc(r.round)+'</td><td><div class="race-cell">'+photo+'<div class="race-info"><b>'+esc(r.name)+'</b><div class="sub">'+esc(r.circuit||'')+'</div>'+lock+'</div></div></td><td class="hide-sm">'+esc(fmtDate(r.date))+'</td><td>'+
      (done?(w?'<span class="who">'+plate(w)+'<span>'+esc(w.name)+'</span></span>':'–'):(allowed?'<span class="chip">Lista para resultados</span>':'<span class="chip">Bloqueada</span>'))+'</td></tr>';
  }).join('');
  var body='<div class="tw"><table><thead><tr><th>Ronda</th><th>Gran Premio / circuito</th><th class="hide-sm">Fecha</th><th>Ganador</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  return '<section class="panel"><div class="ph"><h2>Calendario 2023</h2><span class="chip">21 carreras fijas</span></div>'+body+'</section>';
}
function resultTable(title,map,ptsArr,race){
  var ent=Object.keys(map||{}).map(function(id){return {r:riderById(id),v:map[id]};}).filter(function(x){return x.r;}).sort(function(a,b){return rankVal(a.v)-rankVal(b.v);});
  if(!ent.length)return '';
  var rows=ent.map(function(x){
    var t=teamOf(x.r), p=typeof x.v==='number'?(ptsArr[x.v-1]||0):0;
    return '<tr data-act="rider" data-id="'+esc(x.r.id)+'"><td class="pos'+(typeof x.v==='number'?'':' dnf')+'">'+(typeof x.v==='number'?x.v:x.v)+'</td><td><span class="who">'+plate(x.r)+'<b>'+esc(x.r.name)+'</b></span></td><td class="hide-sm">'+esc(t?t.name:'')+'</td><td class="num pts">'+p+'</td></tr>';
  }).join('');
  return '<section class="panel"><div class="ph"><h2>'+title+'</h2></div><div class="tw"><table><thead><tr><th>Pos</th><th>Piloto</th><th class="hide-sm">Constructor</th><th class="num">Pts</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function viewRace(C){
  var race=S.races.find(function(r){return r.id===S.raceId;});
  if(!race){S.raceId=null;return viewCarreras(C);}
  var W=S.canWrite, pole=riderById(race.pole), fl=riderById(race.fl);
  var photo=race.photo?'<img class="race-photo" src="'+esc(race.photo)+'" alt="Circuito de '+esc(race.name)+'" onerror="this.style.display=\'none\'">':'';
  var head='<section class="panel"><div class="pb" style="display:grid;gap:14px"><button class="back" data-act="back-races">← Calendario</button>'+
    photo+
    '<div><span class="lbl">Ronda '+esc(race.round)+(race.date?' · '+esc(fmtDate(race.date)):'')+'</span><h2 style="font-size:clamp(28px,5vw,42px);font-weight:900;margin-top:4px">'+esc(race.name)+'</h2>'+(race.circuit?'<p class="muted">'+esc(race.circuit)+'</p>':'')+'</div>'+
    '<div class="btns">'+
    (pole?'<span class="chip">Pole: '+esc(pole.name)+'</span>':'')+(fl?'<span class="chip">Vuelta rápida: '+esc(fl.name)+(Number(S.cfg.flPoint)?' (+'+Number(S.cfg.flPoint)+')':'')+'</span>':'')+'</div>'+
    (W?'<div class="btns">'+(hasResults(race)?'<button class="btn pri" data-act="edit-results" data-id="'+esc(race.id)+'">Editar resultados</button>':(canEnterResults(race)?'<button class="btn pri" data-act="edit-results" data-id="'+esc(race.id)+'">Introducir resultados</button>':'<span class="chip">Completa la carrera anterior para desbloquear</span>'))+'</div>':'')+

    var t=teamOf(s.r);

function stat(l,v){return '<div><span class="lbl">'+l+'</span><span class="v">'+v+'</span></div>';}
function viewProfile(C){
  var s=C.st[S.riderId];
  if(!s){S.riderId=null;return viewPilotos(C);}
  var r=s.r,t=teamOf(r),nd=C.done.length,rank=C.rank[r.id],lead=C.ranked[0],W=S.canWrite;
  
  var head='<section class="panel"><div class="pb" style="display:grid;gap:14px"><button class="back" data-act="back-riders">← Pilotos</button><div class="phead">'+plate(r,'lg')+
    '<div class="info"><h2>'+esc(r.name)+'</h2><div class="who">'+(t?'<i class="sw" style="background:'+hex(t.color)+'"></i><span>'+esc(t.name)+'</span>':'<span class="muted">Sin constructor</span>')+(r.country?'<span class="chip">'+esc(r.country)+'</span>':'')+'</div></div>'+
    (W?'<div class="btns"><button class="btn" data-act="edit-rider" data-id="'+esc(r.id)+'">Editar</button>'+delBtn('del-rider',r.id,'Eliminar')+'</div>':'')+'</div>'+
    (r.bio?'<p class="bio">'+esc(r.bio)+'</p>':'')+'</div></section>';
  var stats='<div class="stats">'+
    stat('Posición',nd?ord(rank):'–')+stat('Puntos',s.pts)+stat('Dif. con líder',nd&&rank>1?'−'+(lead.pts-s.pts):'–')+stat('Victorias',s.wins)+stat('Podios',s.podiums)+
    stat('Poles',s.poles)+stat('Vueltas rápidas',s.fl)+stat('Abandonos',s.dnf)+stat('Mejor resultado',s.best===null?'–':'P'+s.best)+
    stat('Posición media',s.nPos?(s.sumPos/s.nPos).toFixed(1):'–')+stat('Puntos por carrera',nd?(s.pts/nd).toFixed(1):'–')+'</div>';
  var chart='';
  if(nd){
    var series=[{name:r.name,color:hex(t&&t.color),dash:'',vals:s.cum}];
    if(lead&&lead.r.id!==r.id)series.push({name:lead.r.name+' (líder)',color:'var(--muted)',dash:'6 5',vals:lead.cum});
    var L=chartLabels(C);
    chart='<section class="panel"><div class="ph"><h2>Puntos carrera a carrera</h2></div>'+lineChart('rider',series,L.short,L.long)+'</section>';
  }
  function cell(v){return v===undefined?'<span class="muted">–</span>':(typeof v==='number'?'P'+v:'<span class="dnf">'+v+'</span>');}
  var rows=C.done.map(function(race,i){
    var x=s.rows[race.id]; if(!x)return '';
    return '<tr data-act="race" data-id="'+esc(race.id)+'"><td class="pos">'+esc(race.round)+'</td><td><b>'+esc(race.name)+'</b></td><td>'+cell(x.gp)+'</td>'+
      '<td class="hide-sm">'+(x.pole?'<span class="chip">Pole</span> ':'')+(x.fl?'<span class="chip">VR</span>':'')+'</td><td class="num pts">'+x.pts+'</td><td class="num hide-sm">'+s.cum[i+1]+'</td></tr>';

/* ---------- writes ---------- */
var queues={};
function chain(path,fn){var prev=queues[path]||Promise.resolve();var next=prev.catch(function(){}).then(fn);queues[path]=next;return next;}
function put(path,data){return chain(path,function(){return db.doc(path).set(data);});}
function remove(path){return chain(path,function(){return db.doc(path).delete();});}
function attempt(fn,okMsg){
  return Promise.resolve().then(fn).then(function(){if(okMsg)toast(okMsg);return true;}).catch(function(e){
    toast('No se pudo guardar'+(e&&e.message?': '+e.message:'')+'.');return false;});
}
function newId(col){return db.collection(col).doc().id;}

/* ---------- overlay ---------- */
function openSheet(html,wide){
  $ov.innerHTML='<div class="ov" data-act="ov-backdrop"><div class="sheet'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  $ov.hidden=false; document.body.style.overflow='hidden';
  var f=$ov.querySelector('input,select,textarea'); if(f)f.focus();
}
function closeSheet(){$ov.hidden=true;$ov.innerHTML='';document.body.style.overflow='';}

function readResultsForm(f){
  var gp={},errs=[],seenG={};
  function parse(v){return v===''?undefined:(v==='DNF'||v==='DSQ')?v:Number(v);}
  S.riders.forEach(function(r){
    var g=parse(f.elements['gp-'+r.id].value);
    if(g!==undefined){gp[r.id]=g; if(typeof g==='number'){if(seenG[g])errs.push('P'+g+' repetida en la carrera');seenG[g]=1;}}
  });
  return {gp:gp,pole:f.elements['rs-pole'].value,fl:f.elements['rs-fl'].value,errs:errs};
}
function updateResultsForm(){
  var f=document.getElementById('f-results'); if(!f)return;
  var d=readResultsForm(f);
  f.querySelectorAll('tr[data-rid]').forEach(function(tr){
    var id=tr.dataset.rid,p=0,g=d.gp[id];
    if(typeof g==='number')p+=S.cfg.gp[g-1]||0; if(d.fl===id)p+=Number(S.cfg.flPoint)||0;
    tr.querySelector('.live').textContent=p;
  });
  var uniq=d.errs.filter(function(e,i){return d.errs.indexOf(e)===i;});
  document.getElementById('sheet-msg').textContent=uniq.join(' · ');
  document.getElementById('sheet-save').disabled=uniq.length>0;
}

function resetAll(){
  var jobs=[];
  S.riders.forEach(function(r){jobs.push(function(){return remove('riders/'+r.id);});});
  S.teams.forEach(function(t){jobs.push(function(){return remove('teams/'+t.id);});});
  // Reiniciar significa dejar las 21 carreras del calendario desde cero:
  // mismo calendario, pero sin resultados, pole ni vuelta rápida.
  FIXED_RACES.forEach(function(base){
    jobs.push(function(){
      return put('races/'+base.id,Object.assign({},base,{gp:{},pole:'',fl:''}));
    });
  });
  jobs.push(function(){
    return put('settings/main',Object.assign({},DEFAULT_CFG,{season:'2023',example:false}));
  });
  // Recargar al terminar reconstruye por completo el estado en memoria.
  // Así el bloqueo secuencial vuelve a empezar en la carrera 1.
  return jobs.reduce(function(p,j){return p.then(j);},Promise.resolve()).then(function(){
    location.reload();
  });
}

/* ---------- events ---------- */
function confirmed(key){
  if(S.confirm===key){S.confirm='';clearTimeout(confirmTimer);return true;}
  S.confirm=key;render();clearTimeout(confirmTimer);
  confirmTimer=setTimeout(function(){S.confirm='';render();},4000);
  return false;
}
function go(tab){S.tab=tab;S.riderId=null;S.raceId=null;setHash(tab);render();toTop();}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(S.confirm){S.confirm='';render();}return;}
  var act=el.dataset.act,id=el.dataset.id;
  var editActions=['new-rider','edit-rider','new-team','edit-team','edit-results','load-example','reset-all'];
  if(['new-race','edit-race','del-race'].indexOf(act)!==-1)return;
  if(editActions.indexOf(act)!==-1&&!S.canWrite){renderLogin('Inicia sesión como administrador para modificar el campeonato.');return;}
  if(act==='ov-backdrop'){if(e.target===el)closeSheet();return;}
  if(act==='ov-close'){closeSheet();return;}
  if(act.indexOf('del-')===0||act==='reset-all'){if(!S.canWrite)return;if(!confirmed(act+':'+(id||'')))return;}
  else if(S.confirm){S.confirm='';}
  switch(act){
    case 'login':loginSheet();break;
    case 'register':registerSheet();break;
    case 'my-profile':openProfileForm();break;
    case 'edit-profile':openProfileForm();break;
    case 'logout':logout();break;
    case 'tab':go(el.dataset.tab);break;
    case 'rider':S.tab='pilotos';S.riderId=id;S.raceId=null;setHash('pilotos');render();toTop();break;
    case 'race':S.tab='carreras';S.raceId=id;S.riderId=null;setHash('carreras');render();toTop();break;
    case 'back-riders':S.riderId=null;render();break;
    case 'back-races':S.raceId=null;render();break;
    case 'chart-mode':S.chartMode=el.dataset.mode;render();break;
    case 'toggle-like':{
      var lu=currentUser(); if(!lu){loginSheet();break;}
      var existing=S.likes.find(function(x){return x.post_id===id&&x.user_id===lu.id;});
      if(existing)attempt(function(){return remove('likes/'+existing.id);},'Reacción quitada');
      else{var lid=newId('likes');attempt(function(){return put('likes/'+lid,{post_id:id,user_id:lu.id,created_at:new Date().toISOString()});},'Reacción añadida');}
      break;
    }
    case 'del-post':if(!confirmed('del-post:'+id))break;attempt(function(){return remove('posts/'+id);},'Publicación eliminada');break;
    case 'season':S.championSeason=id;render();break;
    case 'new-rider':openRiderForm();break;
    case 'edit-rider':openRiderForm(id);break;
    case 'new-team':openTeamForm();break;
    case 'edit-team':openTeamForm(id);break;
    case 'new-race':openRaceForm();break;
    case 'edit-race':openRaceForm(id);break;
    case 'edit-results':{var rr=S.races.find(function(x){return x.id===id;});if(rr&&canEnterResults(rr))openResultsForm(id);else toast('Completa primero la carrera anterior.');break;}
    case 'del-rider':S.riderId=null;render();attempt(function(){return remove('riders/'+id);},'Piloto eliminado');break;
    case 'del-team':attempt(function(){return remove('teams/'+id);},'Constructor eliminado');break;
    case 'del-race':S.raceId=null;render();attempt(function(){return remove('races/'+id);},'Carrera eliminada');break;
    case 'load-example':attempt(loadExample,'Ejemplo cargado');break;
    case 'reset-all':attempt(resetAll,'Campeonato borrado');break;
  }
});
document.addEventListener('change',function(e){if(e.target.closest&&e.target.closest('#f-results'))updateResultsForm();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$ov.hidden)closeSheet();});
document.addEventListener('submit',function(e){
  e.preventDefault();

    var cu=currentUser();if(!cu){loginSheet();return;}
    var ct=f.elements.text.value.trim(), postId=f.dataset.post;

    }).catch(function(e){document.getElementById('sheet-msg').textContent=e.message||'No se pudo crear la cuenta.';});

  }
  if(fid==='f-login2'){

    db.client.auth.signInWithPassword({email:le,password:lp}).then(function(res){
      if(res.error){document.getElementById('sheet-msg').textContent='Email o contraseña incorrectos.';return;}
      window.__motogpUser=res.data.user;S.user=res.data.user;closeSheet();location.reload();
    }).catch(function(e){document.getElementById('sheet-msg').textContent=e.message||'No se pudo iniciar sesión.';});
    return;
  }
  if(fid==='f-profile'){
    var pu=currentUser();if(!pu)return;
    var pid=pu.id, pdata={id:pid,username:f.elements['pf-user'].value.trim(),full_name:f.elements['pf-name'].value.trim(),avatar_url:f.elements['pf-avatar'].value.trim(),bio:f.elements['pf-bio'].value.trim(),created_at:(S.profile&&S.profile.created_at)||new Date().toISOString()};
    if(!pdata.username){document.getElementById('sheet-msg').textContent='El nombre de usuario es obligatorio.';return;}
    attempt(function(){return put('profiles/'+pid,pdata);},'Perfil guardado').then(function(){S.profile=profileById(pid)||pdata;});
    closeSheet();
    return;
  }
  if(fid==='f-post'){
    var pu2=currentUser();if(!pu2){loginSheet();return;}
    var textv=f.elements['text']?f.elements['text'].value.trim():document.getElementById('post-text').value.trim();
    var file=document.getElementById('post-video').files[0], msg=document.getElementById('upload-msg');
    msg.textContent=file?'Subiendo clip…':'Publicando…';
    document.getElementById('sheet-save')?.setAttribute('disabled','disabled');
    var finish=function(url){var idp=newId('posts');return put('posts/'+idp,{user_id:pu2.id,text:textv,clip_url:url||'',created_at:new Date().toISOString()});};
    var upload=file?db.client.storage.from('clips').upload(pu2.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),file,{upsert:false,contentType:file.type}).then(function(res){
      if(res.error)throw res.error;
      return db.client.storage.from('clips').getPublicUrl(res.data.path).data.publicUrl;
    }):Promise.resolve('');
    upload.then(finish).then(function(){toast('Publicación creada');f.reset();msg.textContent='';}).catch(function(e){msg.textContent='No se pudo publicar: '+(e.message||'comprueba el bucket clips.');}).finally(function(){var b=document.getElementById('sheet-save');if(b)b.removeAttribute('disabled');});
    return;
  }
  if(fid==='f-login'){
    var email=f.elements.email.value.trim(),pw=f.elements.password.value;
    if(!db||!db.client){renderLogin('Supabase todavía no está disponible. Recarga la página.');return;}
    db.client.auth.signInWithPassword({email:email,password:pw}).then(function(res){
      if(res.error){renderLogin('Email o contraseña incorrectos.');return;}
      window.__motogpUser=res.data.user||null;
      S.canWrite=!!window.__motogpUser;
      closeSheet();
      location.reload();
    }).catch(function(e){
      console.error(e);renderLogin('No se pudo iniciar sesión. Inténtalo de nuevo.');
    });
    return;
  }
  if(fid==='f-rider'){
    var name=f.elements['rf-name'].value.trim(); if(!name)return;
    var num=parseInt(f.elements['rf-num'].value,10), rid=id||newId('riders'), old=id?riderById(id):null;
    closeSheet();
    attempt(function(){return put('riders/'+rid,{name:name,number:isFinite(num)?num:'',teamId:f.elements['rf-team'].value,country:f.elements['rf-country'].value.trim(),bio:f.elements['rf-bio'].value.trim()});},id?'Piloto actualizado':'Piloto añadido');
    if(!id){S.tab='pilotos';}
  }else if(fid==='f-team'){
    var tn=f.elements['tf-name'].value.trim(); if(!tn)return;
    var tid=id||newId('teams'); closeSheet();
    attempt(function(){return put('teams/'+tid,{name:tn,color:f.elements['tf-color'].value});},id?'Constructor actualizado':'Constructor añadido');
  }else if(fid==='f-race'){
    var rn=f.elements['gf-name'].value.trim(); if(!rn)return;
    var old2=id?S.races.find(function(x){return x.id===id;}):null, gid=id||newId('races');
    var data={name:rn,circuit:f.elements['gf-circuit'].value.trim(),date:f.elements['gf-date'].value,round:parseInt(f.elements['gf-round'].value,10)||1,
      gp:old2&&old2.gp?old2.gp:{},pole:old2&&old2.pole?old2.pole:'',fl:old2&&old2.fl?old2.fl:''};
    closeSheet();
    attempt(function(){return put('races/'+gid,data);},id?'Carrera actualizada':'Carrera añadida');
  }else if(fid==='f-results'){
    var race=S.races.find(function(x){return x.id===id;}); if(!race)return;
    var d=readResultsForm(f); if(d.errs.length)return;
    var upd=Object.assign({},race); delete upd.id;
    upd.gp=d.gp; delete upd.sp; upd.pole=d.pole; upd.fl=d.fl;
    closeSheet();
    attempt(function(){return put('races/'+id,upd);},'Resultados guardados');
  }else if(fid==='f-cfg'){
    if(!S.canWrite)return;
    function list(s){return s.split(/[\s,;]+/).map(Number).filter(function(n){return isFinite(n)&&n>=0;});}
    var gp=list(document.getElementById('cfg-gp').value);
    if(!gp.length){toast('Escribe los puntos del Gran Premio, por ejemplo 25, 20, 16.');return;}
    var nm=document.getElementById('cfg-name').value.trim()||DEFAULT_CFG.name;
    attempt(function(){return put('settings/main',{name:nm,season:document.getElementById('cfg-season').value.trim(),gp:gp,flPoint:Number(document.getElementById('cfg-fl').value)||0,example:!!S.cfg.example});},'Ajustes guardados');
  }
});
window.addEventListener('hashchange',function(){
  var t=location.hash.slice(1);
  if(TABS.some(function(x){return x[0]===t;})&&t!==S.tab){S.tab=t;S.riderId=null;S.raceId=null;render();}
});

/* ---------- boot ---------- */
(function(){var t=location.hash.slice(1);if(TABS.some(function(x){return x[0]===t;}))S.tab=t;})();
db=supabaseDB();
S.canWrite=false;
render();
function startData(){
  function got(k){S.got[k]=true;S.loaded=!!(S.got.teams&&S.got.riders&&S.got.races&&S.got.cfg);render();}
  function fail(e){console.error(e);S.status='error';render();}
  db.collection('teams').onSnapshot(function(s){S.teams=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});got('teams');},fail);
  db.collection('riders').onSnapshot(function(s){S.riders=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});got('riders');},fail);
  db.collection('races').onSnapshot(function(s){S.races=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});got('races');},fail);
  db.doc('settings/main').onSnapshot(function(s){S.cfg=Object.assign({},DEFAULT_CFG,s.exists?s.data():{});got('cfg');},fail);
}
db.client.auth.getSession().then(function(res){
  window.__motogpUser=res.data&&res.data.session?res.data.session.user:null;
  S.user=window.__motogpUser;
  refreshPermissions();
  loadCommunityData().then(function(){render();});
  render();
  if(S.canWrite) installFixedSchedule().catch(function(e){console.error(e);});
  startData();
  subscribeCommunity();
  db.client.auth.onAuthStateChange(function(event,session){
    window.__motogpUser=session?session.user:null;
    S.user=window.__motogpUser;
    refreshPermissions();
    if(event==='SIGNED_OUT'||event==='SIGNED_IN'||event==='TOKEN_REFRESHED')render();
    if(event==='SIGNED_IN'&&S.canWrite) installFixedSchedule().catch(function(e){console.error(e);});
  });
}).catch(function(e){
  console.error(e);
  S.status='error';
  render();
});
})();
</script>

</body></html>
